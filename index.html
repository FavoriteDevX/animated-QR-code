<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ QRFuse - Animated QR Code Generator</title>
    <!-- Tailwind CSS for a clean, modern dark UI -->
    <script src="https://tailwindcss.com"></script>
    <!-- Vanilla QR Code library running entirely client-side -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6">

    <!-- Header -->
    <header class="text-center my-6">
        <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500">
            ⚡ QRFuse
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base">Transform standard QR codes into living, animated functional art.</p>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-5xl bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col md:flex-row gap-8 items-center justify-center backdrop-blur-md">
        
        <!-- Controls Column -->
        <div class="w-full md:w-1/2 flex flex-col gap-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Target URL or Text</label>
                <input type="text" id="qr-text" value="https://github.com" 
                       class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Choose Animation Style</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="changeStyle('pulse')" id="btn-pulse" class="py-2.5 px-3 rounded-lg border text-sm font-semibold transition bg-purple-600 border-purple-500 text-white">
                        👾 Retro Pulse
                    </button>
                    <button onclick="changeStyle('matrix')" id="btn-matrix" class="py-2.5 px-3 rounded-lg border text-sm font-semibold transition bg-gray-950 border-gray-800 text-gray-400 hover:border-gray-700">
                        🟢 Matrix Rain
                    </button>
                    <button onclick="changeStyle('wave')" id="btn-wave" class="py-2.5 px-3 rounded-lg border text-sm font-semibold transition bg-gray-950 border-gray-800 text-gray-400 hover:border-gray-700">
                        🌊 Sine Wave
                    </button>
                </div>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button onclick="generateAnimatedQR()" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-purple-500/20 transition duration-200">
                    Generate Code
                </button>
                <button onclick="downloadAnimation()" id="btn-download" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                    📥 Download WebM
                </button>
            </div>
        </div>

        <!-- Preview Column -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center">
            <div class="p-4 rounded-2xl bg-white shadow-xl relative">
                <!-- Canvas where the rendering takes place -->
                <canvas id="qr-canvas" width="360" height="360" class="rounded-lg"></canvas>
            </div>
            <p class="text-xs text-gray-500 mt-4 text-center">💡 Point your smartphone camera at the screen to test functionality anytime.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 my-6">
        Powered by WebGL & Canvas API • Level H Error Correction (30%)
    </footer>
    <script>
        let animationFrameId;
        let currentStyle = 'pulse';
        let qrModules = [];
        let qrSize = 0;
        let animationStates = [];

        function changeStyle(style) {
            currentStyle = style;
            ['pulse', 'matrix', 'wave'].forEach(s => {
                const btn = document.getElementById(`btn-${s}`);
                if (s === style) {
                    btn.className = "py-2.5 px-3 rounded-lg border text-sm font-semibold transition bg-purple-600 border-purple-500 text-white";
                } else {
                    btn.className = "py-2.5 px-3 rounded-lg border text-sm font-semibold transition bg-gray-950 border-gray-800 text-gray-400 hover:border-gray-700";
                }
            });
            if (qrModules.length > 0) startAnimationLoop();
        }

        async function generateAnimatedQR() {
            const text = document.getElementById('qr-text').value;
            if (!text) return;

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            try {
                // Generates the raw QR dataset inside the browser
                const qr = QRCode.create(text, { errorCorrectionLevel: 'H' });
                qrModules = qr.modules.data;
                qrSize = qr.modules.size;

                // Set up initial unique variables for physics/rendering styles
                animationStates = [];
                for (let r = 0; r < qrSize; r++) {
                    animationStates[r] = [];
                    for (let c = 0; c < qrSize; c++) {
                        animationStates[r][c] = {
                            phase: Math.random() * Math.PI * 2,
                            speed: 0.04 + Math.random() * 0.04,
                            brightness: Math.random()
                        };
                    }
                }

                startAnimationLoop();
            } catch (err) {
                console.error(err);
                alert('Error creating QR Code.');
            }
        }

        function startAnimationLoop() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            const canvas = document.getElementById('qr-canvas');
            const ctx = canvas.getContext('2d');
            const canvasSize = canvas.width;
            const cellSize = canvasSize / qrSize;

            function draw() {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvasSize, canvasSize);

                for (let r = 0; r < qrSize; r++) {
                    for (let c = 0; c < qrSize; c++) {
                        const isDark = qrModules[r * qrSize + c] === 1;

                        // Critical positioning markers kept 100% static for high scan reliability
                        const isFinderPattern = 
                            (r < 7 && c < 7) || 
                            (r < 7 && c >= qrSize - 7) || 
                            (r >= qrSize - 7 && c < 7);

                        if (isDark) {
                            if (isFinderPattern) {
                                ctx.fillStyle = '#000000';
                                ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                            } else {
                                // Specific style algorithms
                                if (currentStyle === 'pulse') {
                                    animationStates[r][c].phase += animationStates[r][c].speed;
                                    const pulse = 0.55 + Math.sin(animationStates[r][c].phase) * 0.45;
                                    ctx.fillStyle = `rgba(0, 0, 0, ${pulse})`;
                                    ctx.fillRect(
                                        (c * cellSize) + (cellSize * (1 - pulse) / 2), 
                                        (r * cellSize) + (cellSize * (1 - pulse) / 2), 
                                        cellSize * pulse, 
                                        cellSize * pulse
                                    );
                                } 
                                else if (currentStyle === 'matrix') {
                                    animationStates[r][c].brightness -= 0.02;
                                    if (animationStates[r][c].brightness < 0.1 || Math.random() < 0.005) {
                                        animationStates[r][c].brightness = 1.0;
                                    }
                                    ctx.fillStyle = `rgb(0, ${Math.floor(animationStates[r][c].brightness * 180 + 50)}, 0)`;
                                    ctx.fillRect(c * cellSize + 0.5, r * cellSize + 0.5, cellSize - 1, cellSize - 1);
                                } 
                                else if (currentStyle === 'wave') {
                                    const time = Date.now() * 0.004;
                                    const wave = 0.5 + Math.sin((r + c) * 0.3 + time) * 0.5;
                                    ctx.fillStyle = `rgba(0, 0, 0, ${0.4 + wave * 0.6})`;
                                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                                }
                            }
                        }
                    }
                }
                animationFrameId = requestAnimationFrame(draw);
            }
            draw();
        }
        // Export system recording smooth canvas streams directly
        function downloadAnimation() {
            const canvas = document.getElementById('qr-canvas');
            const downloadBtn = document.getElementById('btn-download');
            
            const stream = canvas.captureStream(30);
            const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `animated-qr-${currentStyle}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                downloadBtn.innerText = "📥 Download WebM";
                downloadBtn.disabled = false;
            };

            // Captures a 3-second pristine loop
            downloadBtn.innerText = "Recording (3s)...";
            downloadBtn.disabled = true;
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 3000);
        }

        window.onload = generateAnimatedQR;
    </script>
</body>
</html>
